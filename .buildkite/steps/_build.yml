label: ":hammer: build ({slug})"
key: build-{slug}

# key must remain build-{slug}: scripts/cicd/20.build.sh derives SLUG from
# ${BUILDKITE_STEP_KEY#build-}. Renaming would silently break that derivation.

commands:
  - echo \"+++ Start Services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests - unit\"
  - bash scripts/cicd/30.test-unit.sh
  - echo \"+++ Tests - integraion\"
  - bash scripts/cicd/40.test-integration.sh
  - echo \"+++ Tests - e2e\"
  - bash scripts/cicd/50.test-e2e.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
      upload:
        files: "artifacts/**/*.tar.zst"
      promote: {}
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"

timeout_in_minutes: 60

agents:
  queue: "default-{queue}"
