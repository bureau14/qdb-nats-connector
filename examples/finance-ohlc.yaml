# Finance OHLC market data YAML parser configuration
# Routes data to exchange-specific tables: finance.{exchange}.{symbol}
# Demonstrates dynamic table routing based on message content,
# a string column (stock_id) and a timestamp value column (event_time)
# Example: AAPL on NASDAQ -> "finance.NASDAQ.AAPL", MSFT on NYSE -> "finance.NYSE.MSFT"
#
# stock_id is a STRING column, not SYMBOL: concurrent first pushes into a
# fresh symtable intermittently fail with qdb_e_invalid_argument from the
# client-side symbol resolution (QDB-19359 follow-up); string columns write
# identical values without the symtable dependency.

output:
  columns:
    - name: "stock_id"
      type: "string"
    - name: "open"
      type: "double"
    - name: "high"
      type: "double"
    - name: "low"
      type: "double"
    - name: "close"
      type: "double"
    - name: "volume"
      type: "int64"
    - name: "trading_pair"
      type: "string"
    - name: "event_time"
      type: "timestamp"

transformations:
  # Decompress gzipped message first
  - step: "decompress"
    config:
      algorithm: "gzip"

  # Parse incoming JSON message
  - step: "parse_json"
    config: {}

  # Extract exchange and symbol for dynamic table routing (must happen first)
  - step: "extract_field"
    config:
      source: "exchange"
      target: "exchange"
      type: "string"

  - step: "extract_field"
    config:
      source: "symbol"
      target: "stock_id"
      type: "string"

  # Create dynamic table name: finance.{exchange}.{symbol}
  # This enables routing like: NASDAQ.AAPL → "finance.NASDAQ.AAPL"
  - step: "compute_field"
    config:
      operation: "concat"
      target: "table_name"
      fields: ['"finance"', '"."', "exchange", '"."', "stock_id"]

  # Extract the computed table name for dynamic routing
  - step: "extract_table"
    config:
      source: "table_name"

  # Extract and convert timestamp field (ISO8601 format)
  - step: "extract_index"
    config:
      source: "timestamp"
      format: "2006-01-02T15:04:05Z"

  # Also store the event time as a regular timestamp value column
  - step: "extract_timestamp"
    config:
      source: "timestamp"
      target: "event_time"
      format: "2006-01-02T15:04:05Z"

  # Extract OHLC price data
  - step: "extract_field"
    config:
      source: "o"
      target: "open"
      type: "float64"

  - step: "extract_field"
    config:
      source: "h"
      target: "high"
      type: "float64"

  - step: "extract_field"
    config:
      source: "l"
      target: "low"
      type: "float64"

  - step: "extract_field"
    config:
      source: "c"
      target: "close"
      type: "float64"

  # Extract volume data
  - step: "extract_field"
    config:
      source: "v"
      target: "volume"
      type: "int64"

  # Create composite trading pair field
  - step: "compute_field"
    config:
      operation: "concat"
      target: "trading_pair"
      fields: ["exchange", '":"', "stock_id"]