# Finance OHLC market data YAML parser configuration
# Parses JSON messages with nested market metadata and OHLC price data
# Demonstrates gzip compression handling for high-volume market data

output:
  table_name: "finance_ohlc"
  columns:
    - name: "stock_id"
      type: "string"
    - name: "open"
      type: "double"
    - name: "high"
      type: "double"
    - name: "low"
      type: "double"
    - name: "close"
      type: "double"
    - name: "volume"
      type: "int64"
    - name: "trading_pair"
      type: "string"

transformations:
  # Decompress gzipped message first
  - step: "decompress"
    config:
      algorithm: "gzip"

  # Parse incoming JSON message
  - step: "parse_json"
    config: {}

  # Extract and convert timestamp field (Unix timestamp)
  - step: "extract_index"
    config:
      source: "timestamp"
      format: "unix"

  # Extract stock identifier from nested market metadata
  - step: "extract_field"
    config:
      source: "market.symbol"
      target: "stock_id"
      type: "string"

  # Extract exchange from nested market metadata
  - step: "extract_field"
    config:
      source: "market.exchange"
      target: "exchange"
      type: "string"

  # Extract OHLC price data
  - step: "extract_field"
    config:
      source: "o"
      target: "open"
      type: "float64"

  - step: "extract_field"
    config:
      source: "h"
      target: "high"
      type: "float64"

  - step: "extract_field"
    config:
      source: "l"
      target: "low"
      type: "float64"

  - step: "extract_field"
    config:
      source: "c"
      target: "close"
      type: "float64"

  # Extract volume data
  - step: "extract_field"
    config:
      source: "v"
      target: "volume"
      type: "int64"

  # Create composite trading pair field
  - step: "compute_field"
    config:
      operation: "concat"
      target: "trading_pair"
      fields: ["exchange", ":", "stock_id"]